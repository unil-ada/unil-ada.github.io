- n: 7
  date: '2026-10-26'
  title: Deep Learning Basics
  revealed: true
  description: Deep learning basics, MLPs, Feed-forward networks, Exercise 4 distributed
  detail: '<h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand the fundamentals of neural networks and deep

    learning</li>

    <li>Learn about multi-layer perceptrons (MLPs) and their

    architecture</li>

    <li>Master feed-forward networks and their training process</li>

    <li>Understand stochastic gradient descent (SGD) and

    backpropagation</li>

    <li>Recognize overfitting issues and regularization techniques</li>

    <li>Apply deep learning to real-world problems</li>

    </ul>

    <h4 id="topics-covered">Topics Covered</h4>

    <ul>

    <li><strong>Deep Learning Basics</strong>: Neural network fundamentals

    and motivation</li>

    <li><strong>Multi-layer Perceptron (MLP)</strong>: Architecture and

    design principles</li>

    <li><strong>Feed-forward Networks</strong>: Information flow and network

    topology</li>

    <li><strong>Network Training</strong>: Stochastic Gradient Descent (SGD)

    optimization</li>

    <li><strong>Error Backpropagation</strong>: Algorithm for computing

    gradients</li>

    <li><strong>Overfitting Prevention</strong>: Regularization techniques

    and best practices</li>

    <li><strong>Introduction to TensorFlow</strong>: Applied to supervised

    learning problems</li>

    </ul>


    <h4 id="key-concepts">Key Concepts</h4>

    <ul>

    <li><strong>Perceptron</strong>: Single neuron model and

    limitations</li>

    <li><strong>Universal Approximation Theorem</strong>: Theoretical

    foundation of neural networks</li>

    <li><strong>Activation Functions</strong>: ReLU, sigmoid, tanh, and

    their properties</li>

    <li><strong>Loss Functions</strong>: Mean squared error, cross-entropy

    for different tasks</li>

    <li><strong>Optimization</strong>: Gradient descent variants and

    learning rates</li>

    <li><strong>Regularization</strong>: Dropout, weight decay, early

    stopping</li>

    </ul>

    <h4 id="practical-skills">Practical Skills</h4>

    <ul>

    <li>Building neural networks from scratch</li>

    <li>Implementing backpropagation algorithm</li>

    <li>Using TensorFlow for deep learning tasks</li>

    <li>Network architecture design and hyperparameter tuning</li>

    <li>Debugging and troubleshooting neural networks</li>

    </ul>

    <h4 id="assignments">Assignments</h4>

    <ul>

    <li><strong>Exercise 4</strong>: Distributed this week - Neural network

    implementation</li>

    <li>Practice building and training MLPs</li>

    <li>Explore different activation functions and architectures</li>

    </ul>

    <h4 id="further-reading">Further Reading</h4>

    <ul>

    <li>Deep Learning textbook chapters on MLPs and backpropagation</li>

    <li>TensorFlow documentation and tutorials</li>

    </ul>

    '
