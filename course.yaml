- n: 4
  date: '2026-10-05'
  title: Supervised Learning - Regression
  revealed: true
  description: Supervised Learning, Linear Regression, Gradient Descent, and Exercise 2 distribution
  detail: '<h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand the fundamental concepts of supervised learning</li>

    <li>Master linear and polynomial regression techniques</li>

    <li>Learn optimization methods including gradient descent</li>

    <li>Apply regression models to real-world datasets</li>

    <li>Understand model complexity and overfitting</li>

    </ul>

    <h4 id="topics-covered">Topics Covered</h4>

    <ul>

    <li><strong>Supervised Learning</strong>: The general framework and

    approach</li>

    <li><strong>Linear Regression</strong>: Single and multiple

    variables</li>

    <li><strong>Gradient Descent</strong>: Optimization algorithm for model

    training<br />

    </li>

    <li><strong>Polynomial Regression</strong>: Non-linear

    relationships</li>

    <li><strong>Tuning Model Complexity</strong>: Bias-variance

    tradeoff</li>

    <li><strong>Practical Applications</strong>: Stock market prediction (if

    time permits)</li>

    <li><strong>Data Manipulation</strong>: Introduction to Pandas</li>

    </ul>


    <h4 id="key-concepts">Key Concepts</h4>

    <ul>

    <li>Cost functions and loss minimization</li>

    <li>Normal equation vs gradient descent</li>

    <li>Feature scaling and normalization</li>

    <li>Model evaluation metrics (MSE, MAE, R²)</li>

    <li>Overfitting vs underfitting</li>

    </ul>

    <h4 id="practical-skills">Practical Skills</h4>

    <ul>

    <li>Implementing regression from scratch</li>

    <li>Using scikit-learn for regression tasks</li>

    <li>Data preprocessing with Pandas</li>

    <li>Model evaluation and validation</li>

    </ul>

    <h4 id="assignments">Assignments</h4>

    <ul>

    <li><strong>Exercise 2</strong>: Distributed this week</li>

    <li>Complete finger exercises with TA guidance</li>

    <li>Practice implementing gradient descent</li>

    </ul>

