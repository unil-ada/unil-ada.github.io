  description: Introduction to Machine Learning and Nuvolos setup
  detail: '<h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand the fundamentals of machine learning</li>

    <li>Distinguish between different types of learning paradigms</li>

    <li>Set up your development environment on Nuvolos</li>

    <li>Get familiar with the course structure and expectations</li>

    </ul>

