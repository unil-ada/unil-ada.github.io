- n: 14
  date: '2026-12-14'
  title: Wrap-up and project presentations
  revealed: true
  description: 'An Application of the tools studied so far: Deep Uncertainty Quantification for Integrated
    Assessment Models, Wrap-up of the lecture, Voluntary project presentations, 2h Consulting for the
    capstone project'
  detail: '<h4 id="overview">Overview</h4>

    <p>The final week of the Advanced Data Analytics course brings together

    all the concepts learned throughout the semester. This session includes

    advanced applications, course wrap-up, voluntary project presentations,

    and capstone project consultation.</p>

    <h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand advanced applications of machine learning techniques</li>

    <li>Apply deep uncertainty quantification to complex real-world

    problems</li>

    <li>Synthesize knowledge from all previous weeks</li>

    <li>Present and discuss capstone projects</li>

    <li>Plan for continued learning and professional development</li>

    </ul>

    <h4 id="topics-covered">Topics Covered</h4>

    <ul>

    <li><strong>Deep Uncertainty Quantification</strong>: Advanced

    application for Integrated Assessment Models</li>

    <li><strong>Course Wrap-up</strong>: Review of key concepts and

    methodologies</li>

    <li><strong>Voluntary Project Presentations</strong>: Student showcase

    of capstone projects</li>

    <li><strong>Capstone Project Consulting</strong>: Individual guidance

    and feedback (2h session)</li>

    </ul>


    <h4 id="advanced-application-focus">Advanced Application Focus</h4>

    <ul>

    <li><strong>Integrated Assessment Models</strong>: Climate and economic

    modeling applications</li>

    <li><strong>Uncertainty Quantification</strong>: Bayesian approaches to

    model uncertainty</li>

    <li><strong>Deep Learning for Scientific Computing</strong>: Neural

    networks in complex simulations</li>

    <li><strong>Real-world Impact</strong>: How ML techniques address global

    challenges</li>

    </ul>

    <h4 id="course-synthesis">Course Synthesis</h4>

    <ul>

    <li><strong>Journey Review</strong>: From basic ML to advanced

    applications</li>

    <li><strong>Methodology Integration</strong>: How different techniques

    complement each other</li>

    <li><strong>Problem-Solving Framework</strong>: Systematic approach to

    ML projects</li>

    <li><strong>Best Practices</strong>: Lessons learned and professional

    guidelines</li>

    </ul>

    <h4 id="capstone-project-components">Capstone Project Components</h4>

    <p>Every student must provide a comprehensive capstone project

    demonstrating course learning: - <strong>Technical

    Implementation</strong>: Applied ML solution to a real problem -

    <strong>Code Repository</strong>: Well-documented GitHub repository -

    <strong>Project Report</strong>: Detailed technical report -

    <strong>Presentation</strong>: Clear communication of methods and

    results</p>

    <h4 id="voluntary-presentations">Voluntary Presentations</h4>

    <p>Students may present their capstone projects covering: - Problem

    definition and motivation - Technical approach and methodology -

    Implementation details and challenges - Results and impact assessment -

    Future work and extensions</p>

    <h4 id="consulting-session">Consulting Session</h4>

    <p>Individual 2-hour consulting sessions provide: - Personalized

    feedback on capstone projects - Technical guidance and troubleshooting -

    Career advice and next steps - Research opportunities and directions</p>

    <h4 id="course-completion">Course Completion</h4>

    <p>Final requirements for course completion: - All exercises submitted

    and evaluated - Capstone project completed and submitted - Active

    participation in course activities - Demonstration of learning

    objectives achievement</p>

