- n: 5
  date: '2026-10-12'
  title: Guest Lecture - Generative AI for Programming
  revealed: true
  description: Large Language Models, Autonomous Agents, and AI-Assisted Programming
  detail: '<h4 id="guest-lecturer">Guest Lecturer</h4>

    <p><strong>Anna Smirnova</strong> - PhD Candidate</p>

    <h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand the landscape of AI tools for programming (chatbots,

    assistants, agents)</li>

    <li>Distinguish between standard and reasoning AI models</li>

    <li>Learn effective prompt engineering techniques for code

    generation</li>

    <li>Understand the capabilities and limitations of AI-assisted

    programming</li>

    <li>Get hands-on experience with GitHub Copilot and other AI coding

    tools</li>

    </ul>

    <h4 id="topics-covered">Topics Covered</h4>

    <ul>

    <li><strong>The AI Landscape</strong>: Three types of AI tools for

    coding

    <ul>

    <li>Chatbots (ChatGPT, Claude)</li>

    <li>Code Assistants (GitHub Copilot, Cursor)</li>

    <li>Autonomous Agents (Devin, Claude Code)</li>

    </ul></li>

    <li><strong>Understanding AI Models</strong>: Standard vs. reasoning

    models</li>

    <li><strong>Practical Usage</strong>: How to effectively use GitHub

    Copilot</li>

    <li><strong>Prompt Engineering</strong>: Techniques for better AI

    assistance</li>

    <li><strong>Reality Check</strong>: Benefits, limitations, and ethical

    considerations</li>

    <li><strong>The Future</strong>: Autonomous coding agents and their

    implications</li>

    </ul>


    <h4 id="key-concepts">Key Concepts</h4>

    <ul>

    <li>Large Language Models (LLMs) architecture</li>

    <li>Transformer models and attention mechanisms</li>

    <li>Context windows and token limits</li>

    <li>Fine-tuning vs. prompt engineering</li>

    <li>Chain-of-thought reasoning</li>

    <li>AI safety and alignment</li>

    </ul>

    <h4 id="practical-skills">Practical Skills</h4>

    <ul>

    <li>Using GitHub Copilot effectively</li>

    <li>Writing effective prompts for code generation</li>

    <li>Debugging AI-generated code</li>

    <li>Understanding when to use (and not use) AI assistance</li>

    <li>Evaluating AI tool outputs critically</li>

    </ul>

    <h4 id="important-considerations">Important Considerations</h4>

    <ul>

    <li><strong>Academic Integrity</strong>: Proper attribution and

    understanding</li>

    <li><strong>Code Quality</strong>: AI as a tool, not a replacement for

    learning</li>

    <li><strong>Security</strong>: Risks of copying AI-generated code

    without review</li>

    <li><strong>Bias</strong>: Understanding limitations and biases in AI

    systems</li>

    </ul>

    <h4 id="additional-resources">Additional Resources</h4>

    <ul>

    <li>GitHub Copilot documentation</li>

    <li>OpenAI and Anthropic research papers</li>

    <li>AI safety and ethics guidelines</li>

    </ul>

    '
- n: 6
  date: '2026-10-19'
  title: Classification
  revealed: true
  description: 'Supervised Learning: Classification, k-NN, Decision Trees, Exercise 3 distributed'
  detail: '<h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand fundamental classification concepts and algorithms</li>

    <li>Master k-Nearest Neighbors (k-NN) algorithm</li>

    <li>Learn how to evaluate classifier performance</li>

    <li>Understand Naive Bayes classification</li>

    <li>Explore decision trees and ensemble methods</li>

    <li>Apply classification algorithms to real-world datasets</li>

    </ul>

    <h4 id="topics-covered">Topics Covered</h4>

    <ul>

    <li><strong>Classification Fundamentals</strong>: Problem formulation

    and terminology</li>

    <li><strong>k-Nearest Neighbors (k-NN)</strong>: Instance-based learning

    algorithm</li>

    <li><strong>Classifier Evaluation</strong>: Accuracy, precision, recall,

    F1-score, confusion matrices</li>

    <li><strong>Naive Bayes</strong>: Probabilistic classification based on

    Bayes’ theorem</li>

    <li><strong>Decision Trees</strong>: Tree-based classification and

    feature selection</li>

    <li><strong>Ensemble Methods</strong>: Boosting and Bagging for improved

    performance</li>

    <li><strong>Practical Applications</strong>: Introduction to matplotlib

    (if time permits)</li>

    </ul>


    <h4 id="key-concepts">Key Concepts</h4>

    <ul>

    <li>Supervised vs unsupervised classification</li>

    <li>Training and test set evaluation</li>

    <li>Cross-validation techniques</li>

    <li>Overfitting in classification models</li>

    <li>Feature importance and selection</li>

    <li>Bias-variance tradeoff in classification</li>

    </ul>

    <h4 id="algorithms-covered">Algorithms Covered</h4>

    <ul>

    <li><strong>k-NN</strong>: Distance-based classification</li>

    <li><strong>Naive Bayes</strong>: Probabilistic approach</li>

    <li><strong>Decision Trees</strong>: Rule-based classification</li>

    <li><strong>AdaBoost</strong>: Adaptive boosting</li>

    <li><strong>Bagging</strong>: Bootstrap aggregating</li>

    </ul>

    <h4 id="practical-skills">Practical Skills</h4>

    <ul>

    <li>Implementing classifiers from scratch</li>

    <li>Using scikit-learn for classification tasks</li>

    <li>Model evaluation and performance metrics</li>

    <li>Data visualization with matplotlib</li>

    <li>Handling categorical and numerical features</li>

    </ul>

    <h4 id="assignments">Assignments</h4>

    <ul>

    <li><strong>Exercise 3</strong>: Distributed this week</li>

    <li>Complete finger exercises with TA guidance</li>

    <li>Practice implementing and comparing different classifiers</li>

    </ul>

    '
