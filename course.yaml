- n: 11
  date: '2026-11-23'
  title: Dimensionality Reduction, PCA, Active Learning
  revealed: true
  description: The curse of Dimensionality, Bayesian active learning, Active Subspaces and Gaussian Process
    Regression, Principal Component Analysis, Exercise 7 distributed
  detail: '<h4 id="learning-objectives">Learning Objectives</h4>

    <ul>

    <li>Understand the curse of dimensionality and its implications</li>

    <li>Master Principal Component Analysis (PCA) and its variants</li>

    <li>Learn Bayesian active learning strategies</li>

    <li>Explore active subspaces in the context of Gaussian Process

    regression</li>

    <li>Apply dimensionality reduction techniques to real-world

    datasets</li>

    <li>Understand when and how to use different dimensionality reduction

    methods</li>

    </ul>

    <h4 id="topics-covered">Topics Covered</h4>

    <ul>

    <li><strong>Curse of Dimensionality</strong>: Challenges in

    high-dimensional spaces</li>

    <li><strong>Principal Component Analysis (PCA)</strong>: Linear

    dimensionality reduction</li>

    <li><strong>Kernel PCA</strong>: Non-linear dimensionality reduction

    using kernel methods</li>

    <li><strong>Bayesian Active Learning</strong>: Intelligent sampling

    strategies</li>

    <li><strong>Active Subspaces</strong>: Dimension reduction for complex

    functions</li>

    <li><strong>GP Regression with Active Subspaces</strong>: Combining

    dimensionality reduction with GPs</li>

    </ul>


    <h4 id="key-concepts">Key Concepts</h4>

    <ul>

    <li><strong>High-Dimensional Challenges</strong>: Sparsity, distance

    metrics, visualization problems</li>

    <li><strong>Linear vs Non-linear Methods</strong>: When to use PCA vs

    kernel PCA</li>

    <li><strong>Variance Explained</strong>: Choosing the number of

    components</li>

    <li><strong>Active Learning</strong>: Uncertainty sampling and query

    strategies</li>

    <li><strong>Subspace Identification</strong>: Finding low-dimensional

    structure in high-dimensional functions</li>

    <li><strong>Integration with GPs</strong>: Using active subspaces to

    improve GP scalability</li>

    </ul>

    <h4 id="dimensionality-reduction-methods">Dimensionality Reduction

    Methods</h4>

    <ul>

    <li><strong>PCA</strong>: Eigenvalue decomposition and SVD

    approaches</li>

    <li><strong>Kernel PCA</strong>: RBF, polynomial, and custom

    kernels</li>

    <li><strong>Active Subspaces</strong>: Gradient-based dimension

    reduction</li>

    <li><strong>Comparison</strong>: When to use each method</li>

    </ul>

    <h4 id="active-learning-strategies">Active Learning Strategies</h4>

    <ul>

    <li><strong>Uncertainty Sampling</strong>: Exploiting model

    uncertainty</li>

    <li><strong>Query by Committee</strong>: Ensemble-based active

    learning</li>

    <li><strong>Expected Model Change</strong>: Information-theoretic

    approaches</li>

    <li><strong>Bayesian Optimization</strong>: Active learning for

    expensive function evaluations</li>

    </ul>

    <h4 id="practical-applications">Practical Applications</h4>

    <ul>

    <li><strong>Image Processing</strong>: PCA for image compression and

    visualization</li>

    <li><strong>Wine Dataset Analysis</strong>: Multi-class dimensionality

    reduction</li>

    <li><strong>Financial Data</strong>: Portfolio dimensionality

    reduction</li>

    <li><strong>Scientific Computing</strong>: Active subspaces for

    expensive simulations</li>

    </ul>

    <h4 id="assignments">Assignments</h4>

    <ul>

    <li><strong>Exercise 7</strong>: Distributed this week - PCA and active

    learning implementations</li>

    <li>Compare different dimensionality reduction techniques</li>

    <li>Implement active learning strategies</li>

    </ul>

    <h4 id="tools-and-implementation">Tools and Implementation</h4>

    <ul>

    <li>scikit-learn for PCA and kernel PCA</li>

    <li>Custom implementations for active subspaces</li>

    <li>Visualization techniques for high-dimensional data</li>

    <li>Integration with previous GP implementations</li>

    </ul>

    '
